<!DOCTYPE html>
<html>
    <head>
        <title>
            My Planet Explorer
        </title>
        <meta charset="utf-8">
         <meta name="viewport" content="width=device-width, initial-scale=1">
          <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
           <style>
            body { background-color: #f0f4ff; }
             .navbar { background-color: #1a237e; }
              .navbar-brand, .nav-link { color: #fff !important; }
               .section-title { color: #1a237e; margin: 20px 0 10px; }
                </style>
    </head>
    <body>
        <nav class="navbar navbar-expand-sm">
            <a class="navbar-brand" href="#">
            Planet Explorer</a>
            <ul class="navbar-nav">
                <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Planets</a></li>
                <li class="nav-item"><a class="nav-link" href="#">Stars</a></li>
            </ul>
        </nav>

        <div class="container mt-4">


            <h4 class="section-title">
                Scanning the Galaxy...</h4>
                 <div class="spinner-border text-primary" role="status">
                 </div>
                <div class="spinner-border text-warning" role="status">
                </div>
                 <div class="spinner-border text-danger" role="status">
                 </div>
            <h4 class="section-title">Featured Planets</h4>
            <div class="row">
            <div class="call-md-4">
            <div class="card">
            <div class="card-body"><h5 class="card-title">Earth</h5>
            <p class="card-text">Our Planet Home is the one to have life</p><a class="btn btn-primary" href="#">Explore</a>
        </div>
        </div>
        </div>


        <div class="call-md-4">
            <div class="card">
            <div class="card-body"><h5 class="card-title">Mars</h5>
            <p class="card-text">The Red Planet</p><a class="btn btn-danger" href="#">Explore</a>
        </div>
        </div>
        </div>


        <div class="call-md-4">
            <div class="card">
            <div class="card-body"><h5 class="card-title">Jupiter</h5>
            <p class="card-text">Jupiter is the biggest Planet</p><a class="btn btn-warning" href="#">Explore</a>
        </div>
        </div>
        </div>
        </div>
        <h4 class="section-title">Browse More Planets</h4>
         <ul class="pagination">
             <li class="page-item">
                <a class="page-link" href="#">Previous</a>
            </li> <li class="page-item"><a class="page-link" href="#">1</a>
            </li> <li class="page-item"><a class="page-link" href="#">2</a>
            </li> <li class="page-item"><a class="page-link" href="#">3</a>
            </li> <li class="page-item"><a class="page-link" href="#">Next</a>
            </li> </ul>
        </div>
    </body>
</html>
